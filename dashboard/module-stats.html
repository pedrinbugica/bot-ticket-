<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canais de Stats — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>📊 Canais de Stats</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getStoredGuild, logout, getStats, createStat, deleteStat } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "stats") a.classList.add("active"); });

  const TYPE_LABELS = {
    membros: { label: "Membros totais", icon: "👥", default: "👥 Membros: {value}" },
    humanos: { label: "Humanos (sem bots)", icon: "🧑", default: "🧑 Humanos: {value}" },
    bots: { label: "Bots", icon: "🤖", default: "🤖 Bots: {value}" },
    canais: { label: "Canais", icon: "📢", default: "📢 Canais: {value}" },
    cargos: { label: "Cargos", icon: "🏷️", default: "🏷️ Cargos: {value}" },
    boosts: { label: "Boosts", icon: "🚀", default: "🚀 Boosts: {value}" },
    "nivel-boost": { label: "Nível de Boost", icon: "💎", default: "💎 Nível Boost: {value}" },
    emojis: { label: "Emojis", icon: "😄", default: "😄 Emojis: {value}" },
    tickets: { label: "Tickets abertos", icon: "🎫", default: "🎫 Tickets: {value}" },
  };

  async function load() {
    try {
      const data = await getStats(guildId);
      const channels = data.channels ?? [];
      const byType = Object.fromEntries(channels.map(c => [c.stat_type, c]));

      document.getElementById("content").innerHTML = `
        <div class="alert alert-info" style="max-width:700px;margin-bottom:20px">
          Canais de voz com nomes que se atualizam automaticamente a cada 10 minutos mostrando números do servidor. O Discord limita 2 renomeações por 10 minutos por canal.
        </div>

        <div style="display:grid;gap:12px;max-width:700px" id="statsList"></div>

        <div class="card" style="max-width:700px;margin-top:20px">
          <h3 style="margin:0 0 16px">➕ Adicionar canal de stat</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="form-group">
              <label>Tipo</label>
              <select class="form-control" id="newType">
                ${Object.entries(TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join("")}
              </select>
            </div>
            <div class="form-group">
              <label>ID do canal de voz</label>
              <input class="form-control" id="newChannel" placeholder="ID do canal" />
            </div>
          </div>
          <div class="form-group">
            <label>Formato personalizado (opcional)</label>
            <input class="form-control" id="newFormat" placeholder="Ex: 🌍 Comunidade: {value}" />
            <small style="color:var(--text-muted)">Use <code>{value}</code> onde o número deve aparecer.</small>
          </div>
          <button class="btn btn-primary" id="addBtn">Adicionar canal</button>
          <span id="addMsg" style="font-size:13px;color:var(--green);margin-left:10px;display:none">✅ Adicionado!</span>
        </div>`;

      renderList(byType);

      document.getElementById("addBtn").addEventListener("click", async () => {
        const btn = document.getElementById("addBtn");
        btn.disabled = true; btn.textContent = "Adicionando…";
        try {
          await createStat(guildId, {
            statType: document.getElementById("newType").value,
            channelId: document.getElementById("newChannel").value,
            format: document.getElementById("newFormat").value || null,
          });
          const msg = document.getElementById("addMsg");
          msg.style.display = "inline"; setTimeout(() => msg.style.display = "none", 3000);
          setTimeout(() => window.location.reload(), 1000);
        } catch (err) { alert("Erro: " + err.message); }
        finally { btn.disabled = false; btn.textContent = "Adicionar canal"; }
      });
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }

  function renderList(byType) {
    const list = document.getElementById("statsList");
    const entries = Object.entries(TYPE_LABELS);
    list.innerHTML = entries.map(([type, meta]) => {
      const active = byType[type];
      return `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:22px">${meta.icon}</span>
            <div>
              <div style="font-weight:600">${meta.label}</div>
              ${active ? `<div style="font-size:12px;color:var(--text-muted)">Canal: ${active.channel_id} ${active.format ? `• Formato: ${active.format}` : ""}</div>` : '<div style="font-size:12px;color:var(--text-muted)">Não configurado</div>'}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${active
              ? `<span style="background:var(--green);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px">Ativo</span>
                 <button class="btn btn-danger btn-sm" onclick="removeType('${type}')">Remover</button>`
              : `<span style="background:var(--border);color:var(--text-muted);padding:3px 10px;border-radius:20px;font-size:12px">Inativo</span>`
            }
          </div>
        </div>`;
    }).join("");
  }

  window.removeType = async (type) => {
    if (!confirm(`Remover canal de stats "${type}"?`)) return;
    try {
      await deleteStat(guildId, type);
      window.location.reload();
    } catch (err) { alert("Erro: " + err.message); }
  };

  load();
</script>
</body>
</html>
