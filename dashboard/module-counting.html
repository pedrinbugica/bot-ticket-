<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counting Game — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>🔢 Counting Game</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getModules, patchModule, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "counting") a.classList.add("active"); });

  async function load() {
    try {
      const data = await getModules(guildId);
      const c = data.counting ?? {};
      const enabled = !!c.channel_id;

      document.getElementById("content").innerHTML = `
        <div style="display:grid;gap:20px;max-width:700px">
          ${enabled ? `
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
            <div class="card" style="text-align:center;padding:20px">
              <div style="font-size:32px;font-weight:700;color:var(--accent)">${c.current_number ?? 0}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Número atual</div>
            </div>
            <div class="card" style="text-align:center;padding:20px">
              <div style="font-size:32px;font-weight:700;color:var(--green)">${c.high_score ?? 0}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Recorde</div>
            </div>
            <div class="card" style="text-align:center;padding:20px">
              <div style="font-size:32px">✅</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Status ativo</div>
            </div>
          </div>` : ""}

          <div class="card">
            <div class="alert alert-info">
              Os membros enviam números em sequência no canal configurado. Errar o número ou contar duas vezes seguidas reseta a contagem para zero.
            </div>

            <div class="form-group">
              <label>Status</label>
              <div style="display:flex;align-items:center;gap:12px">
                <label class="toggle">
                  <input type="checkbox" id="countEnabled" ${enabled ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
                <span id="statusLabel" style="font-size:14px">${enabled ? "✅ Ativo" : "⏸ Inativo"}</span>
              </div>
            </div>

            <div class="form-group">
              <label>Canal do jogo (ID)</label>
              <input class="form-control" id="countChannel" value="${c.channel_id ?? ''}" placeholder="ID do canal #🔢-contagem" />
            </div>

            <button class="btn btn-primary" id="saveBtn">Salvar alterações</button>
            <span id="saveMsg" style="font-size:13px;color:var(--green);margin-left:10px;display:none">✅ Salvo!</span>
          </div>
        </div>`;

      document.getElementById("countEnabled").addEventListener("change", (e) => {
        document.getElementById("statusLabel").textContent = e.target.checked ? "✅ Ativo" : "⏸ Inativo";
      });

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true; btn.textContent = "Salvando…";
        try {
          const enabled = document.getElementById("countEnabled").checked;
          if (!enabled) {
            await patchModule(guildId, "counting", { enabled: false });
          } else {
            await patchModule(guildId, "counting", {
              channelId: document.getElementById("countChannel").value,
            });
          }
          const msg = document.getElementById("saveMsg");
          msg.style.display = "inline"; setTimeout(() => msg.style.display = "none", 3000);
          setTimeout(() => window.location.reload(), 1500);
        } catch (err) { alert("Erro: " + err.message); }
        finally { btn.disabled = false; btn.textContent = "Salvar alterações"; }
      });
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
