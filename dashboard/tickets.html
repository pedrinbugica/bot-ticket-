<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>🎫 Tickets</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getTickets, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";
  import { formatDate } from "./js/layout.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "tickets") a.classList.add("active"); });

  let allTickets = [];

  async function load() {
    try {
      const { tickets, stats } = await getTickets(guildId, { limit: 100 });
      allTickets = tickets;

      const resolutionRate = stats.opened > 0 ? Math.round((stats.closed / stats.opened) * 100) : 0;

      document.getElementById("content").innerHTML = `
        <div class="grid grid-4" style="margin-bottom:24px">
          <div class="stat-card">
            <div class="stat-icon">🟢</div>
            <div class="stat-value">${stats.active}</div>
            <div class="stat-label">Abertos agora</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📬</div>
            <div class="stat-value">${stats.opened}</div>
            <div class="stat-label">Total criados</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-value">${stats.closed}</div>
            <div class="stat-label">Total fechados</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-value">${resolutionRate}%</div>
            <div class="stat-label">Taxa de resolução</div>
          </div>
        </div>

        <div class="card">
          <div class="section-header">
            <h3 id="tableTitle">Tickets abertos (${tickets.length})</h3>
            <div style="display:flex;gap:8px;align-items:center">
              <input class="form-control" id="searchTicket" placeholder="Buscar por ID ou usuário..." style="width:220px;font-size:13px" />
            </div>
          </div>
          ${tickets.length === 0
            ? '<p style="color:var(--text-muted);font-size:14px;padding:8px 0">Nenhum ticket aberto no momento.</p>'
            : `<div class="table-wrap">
                <table>
                  <thead><tr><th>Canal</th><th>Tipo</th><th>Aberto por</th><th>Assumido por</th><th>Aberto em</th><th>Última atividade</th></tr></thead>
                  <tbody id="ticketsTable">${renderRows(tickets)}</tbody>
                </table>
              </div>`}
          <div id="emptyMsg" style="display:none;padding:12px;color:var(--text-muted);font-size:14px">Nenhum resultado encontrado.</div>
        </div>`;

      document.getElementById("searchTicket")?.addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allTickets.filter(t =>
          t.channel_id.includes(q) || t.opener_id.includes(q) || (t.claimed_by ?? "").includes(q)
        );
        const tbody = document.getElementById("ticketsTable");
        const empty = document.getElementById("emptyMsg");
        if (!filtered.length) { tbody.innerHTML = ""; empty.style.display = "block"; }
        else { empty.style.display = "none"; tbody.innerHTML = renderRows(filtered); }
        document.getElementById("tableTitle").textContent = `Tickets abertos (${filtered.length})`;
      });

    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }

  function renderRows(tickets) {
    return tickets.map(t => `
      <tr>
        <td><code style="font-size:11px">${t.channel_id}</code></td>
        <td><span class="badge badge-blue">${t.type_value ?? 'Geral'}</span></td>
        <td><code style="font-size:11px">${t.opener_id}</code></td>
        <td style="font-size:12px;color:var(--text-muted)">${t.claimed_by ?? '—'}</td>
        <td style="font-size:11px;color:var(--text-muted)">${formatDate(t.opened_at)}</td>
        <td style="font-size:11px;color:var(--text-muted)">${formatDate(t.last_activity_at)}</td>
      </tr>`).join("");
  }

  load();
</script>
</body>
</html>
