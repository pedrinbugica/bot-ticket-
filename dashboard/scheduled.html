<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagens Agendadas — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>📅 Mensagens Agendadas</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getScheduled, createScheduled, deleteScheduled, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";
  import { formatDate } from "./js/layout.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "scheduled") a.classList.add("active"); });

  async function load() {
    try {
      const { pending, sent } = await getScheduled(guildId);
      document.getElementById("content").innerHTML = `
        <div class="card" style="margin-bottom:20px">
          <div class="section-header"><h3>Agendar nova mensagem</h3></div>
          <div class="grid grid-2" style="gap:12px">
            <div class="form-group"><label>Canal (ID)</label>
              <input class="form-control" id="newChannel" placeholder="ID do canal" /></div>
            <div class="form-group"><label>Data e hora</label>
              <input class="form-control" type="datetime-local" id="newDate" /></div>
          </div>
          <div class="form-group"><label>Mensagem</label>
            <textarea class="form-control" id="newContent" rows="3" placeholder="Texto da mensagem..."></textarea></div>
          <button class="btn btn-primary" id="scheduleBtn">Agendar mensagem</button>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="section-header"><h3>Pendentes (${pending.length})</h3></div>
          ${pending.length === 0
            ? '<p style="color:var(--muted);font-size:14px">Nenhuma mensagem pendente.</p>'
            : `<div class="table-wrap"><table>
                <thead><tr><th>ID</th><th>Canal</th><th>Mensagem</th><th>Enviar em</th><th></th></tr></thead>
                <tbody>
                  ${pending.map((m) => `
                    <tr>
                      <td style="color:var(--muted)">#${m.id}</td>
                      <td style="font-size:12px">${m.channel_id}</td>
                      <td style="font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.content}</td>
                      <td style="font-size:13px;color:var(--yellow)">${formatDate(m.send_at)}</td>
                      <td><button class="btn btn-danger btn-sm" onclick="cancelMsg(${m.id})">Cancelar</button></td>
                    </tr>`).join("")}
                </tbody>
              </table></div>`}
        </div>

        <div class="card">
          <div class="section-header"><h3>Enviadas recentemente</h3></div>
          ${sent.length === 0
            ? '<p style="color:var(--muted);font-size:14px">Nenhuma mensagem enviada ainda.</p>'
            : `<div class="table-wrap"><table>
                <thead><tr><th>Canal</th><th>Mensagem</th><th>Enviada em</th></tr></thead>
                <tbody>
                  ${sent.map((m) => `
                    <tr>
                      <td style="font-size:12px">${m.channel_id}</td>
                      <td style="font-size:13px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.content}</td>
                      <td style="font-size:13px;color:var(--muted)">${formatDate(m.send_at)}</td>
                    </tr>`).join("")}
                </tbody>
              </table></div>`}
        </div>
      `;

      document.getElementById("scheduleBtn").addEventListener("click", async () => {
        const channelId = document.getElementById("newChannel").value.trim();
        const content = document.getElementById("newContent").value.trim();
        const sendAt = document.getElementById("newDate").value;
        if (!channelId || !content || !sendAt) { alert("Preencha todos os campos."); return; }
        try {
          await createScheduled(guildId, { channelId, content, sendAt: new Date(sendAt).toISOString() });
          document.getElementById("newChannel").value = "";
          document.getElementById("newContent").value = "";
          document.getElementById("newDate").value = "";
          load();
        } catch (err) { alert("Erro: " + err.message); }
      });

      window.cancelMsg = async function(id) {
        if (!confirm("Cancelar esta mensagem agendada?")) return;
        try { await deleteScheduled(guildId, id); load(); }
        catch (err) { alert("Erro: " + err.message); }
      };
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
