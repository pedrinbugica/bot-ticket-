<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boas-vindas — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>👋 Boas-vindas</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getModules, patchModule, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "welcome") a.classList.add("active"); });

  async function load() {
    try {
      const data = await getModules(guildId);
      const w = data.welcome ?? {};
      document.getElementById("content").innerHTML = `
        <div class="card" style="max-width:600px">
          <div class="alert alert-info">Use <code>{usuario}</code>, <code>{servidor}</code>, <code>{membros}</code> na mensagem.</div>
          <div class="form-group"><label>Canal de boas-vindas (ID)</label>
            <input class="form-control" id="wChannel" value="${w.welcome_channel_id ?? ''}" placeholder="ID do canal" /></div>
          <div class="form-group"><label>Mensagem de boas-vindas</label>
            <textarea class="form-control" id="wMsg" rows="3" placeholder="Bem-vindo ao {servidor}, {usuario}!">${w.welcome_message ?? ''}</textarea></div>
          <div class="form-group"><label>Canal de saída (ID)</label>
            <input class="form-control" id="gChannel" value="${w.goodbye_channel_id ?? ''}" placeholder="ID do canal (opcional)" /></div>
          <div class="form-group"><label>Mensagem de saída</label>
            <textarea class="form-control" id="gMsg" rows="2" placeholder="Adeus, {usuario}!">${w.goodbye_message ?? ''}</textarea></div>
          <div class="form-group"><label>DM de boas-vindas</label>
            <textarea class="form-control" id="wDm" rows="2" placeholder="Mensagem por DM (opcional)">${w.welcome_dm ?? ''}</textarea></div>
          <div class="form-group"><label>Cargos automáticos (IDs separados por vírgula)</label>
            <input class="form-control" id="autoRoles" value="${(() => { try { return JSON.parse(w.auto_role_ids ?? '[]').join(', '); } catch { return ''; }})()}" placeholder="ID1, ID2, ..." /></div>
          <button class="btn btn-primary" id="saveBtn">Salvar alterações</button>
          <span id="saveMsg" style="font-size:13px;color:var(--green);margin-left:10px;display:none">✅ Salvo!</span>
        </div>`;

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true; btn.textContent = "Salvando…";
        try {
          const roles = document.getElementById("autoRoles").value.split(",").map(s => s.trim()).filter(Boolean);
          await patchModule(guildId, "welcome", {
            welcome_channel_id: document.getElementById("wChannel").value || null,
            welcome_message: document.getElementById("wMsg").value || null,
            goodbye_channel_id: document.getElementById("gChannel").value || null,
            goodbye_message: document.getElementById("gMsg").value || null,
            welcome_dm: document.getElementById("wDm").value || null,
            auto_role_ids: JSON.stringify(roles),
          });
          const msg = document.getElementById("saveMsg");
          msg.style.display = "inline"; setTimeout(() => msg.style.display = "none", 3000);
        } catch (err) { alert("Erro: " + err.message); }
        finally { btn.disabled = false; btn.textContent = "Salvar alterações"; }
      });
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
