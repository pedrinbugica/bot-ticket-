<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteios — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>🎉 Sorteios</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getGiveaways, createGiveaway, endGiveaway, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";
  import { formatDate } from "./js/layout.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "giveaways") a.classList.add("active"); });

  async function load() {
    try {
      const { active, ended } = await getGiveaways(guildId);
      document.getElementById("content").innerHTML = `
        <div class="card" style="margin-bottom:16px">
          <div class="section-header"><h3>Criar sorteio</h3></div>
          <div class="form-group"><label>Canal (ID)</label>
            <input class="form-control" id="gChannelId" placeholder="Cole o ID do canal aqui" /></div>
          <div class="form-group"><label>Prêmio</label>
            <input class="form-control" id="gPrize" placeholder="Ex: Nitro Clássico" /></div>
          <div class="grid grid-2" style="gap:12px">
            <div class="form-group"><label>Duração</label>
              <input class="form-control" id="gDuration" placeholder="Ex: 30m, 1h, 2d" /></div>
            <div class="form-group"><label>Nº de vencedores</label>
              <input class="form-control" type="number" id="gWinners" value="1" min="1" max="20" /></div>
          </div>
          <button class="btn btn-primary" id="createGiveawayBtn">🎉 Criar sorteio</button>
          <span id="gMsg" style="font-size:13px;color:var(--green);margin-left:10px;display:none">✅ Sorteio criado!</span>
          <span id="gErr" style="font-size:13px;color:var(--red);margin-left:10px;display:none"></span>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="section-header"><h3>Sorteios ativos (${active.length})</h3></div>
          ${active.length === 0
            ? '<p style="color:var(--muted);font-size:14px">Nenhum sorteio ativo.</p>'
            : `<div class="table-wrap"><table>
                <thead><tr><th>Prêmio</th><th>Participantes</th><th>Vencedores</th><th>Encerra em</th><th></th></tr></thead>
                <tbody>
                  ${active.map((g) => `
                    <tr>
                      <td><strong>${g.prize}</strong></td>
                      <td>${g.entryCount}</td>
                      <td>${g.winner_count}</td>
                      <td style="color:var(--yellow)">${formatDate(g.ends_at)}</td>
                      <td><button class="btn btn-danger btn-sm" onclick="window.endGiveawayNow(${g.id})">Encerrar</button></td>
                    </tr>`).join("")}
                </tbody>
              </table></div>`}
        </div>

        <div class="card">
          <div class="section-header"><h3>Encerrados recentemente</h3></div>
          ${ended.length === 0
            ? '<p style="color:var(--muted);font-size:14px">Nenhum sorteio encerrado.</p>'
            : `<div class="table-wrap"><table>
                <thead><tr><th>Prêmio</th><th>Encerrado em</th></tr></thead>
                <tbody>
                  ${ended.map((g) => `
                    <tr>
                      <td>${g.prize}</td>
                      <td style="color:var(--muted)">${formatDate(g.ends_at)}</td>
                    </tr>`).join("")}
                </tbody>
              </table></div>`}
        </div>
      `;

      document.getElementById("createGiveawayBtn").addEventListener("click", async () => {
        const btn = document.getElementById("createGiveawayBtn");
        const channelId = document.getElementById("gChannelId").value.trim();
        const prize = document.getElementById("gPrize").value.trim();
        const duracao = document.getElementById("gDuration").value.trim();
        const vencedores = Number(document.getElementById("gWinners").value) || 1;
        const errEl = document.getElementById("gErr");
        const msgEl = document.getElementById("gMsg");

        errEl.style.display = "none";
        msgEl.style.display = "none";

        if (!channelId || !prize || !duracao) {
          errEl.textContent = "Preencha canal, prêmio e duração.";
          errEl.style.display = "inline";
          return;
        }

        btn.disabled = true; btn.textContent = "Criando...";
        try {
          await createGiveaway(guildId, { channelId, prize, duracao, vencedores });
          msgEl.style.display = "inline";
          setTimeout(() => load(), 1500);
        } catch (err) {
          errEl.textContent = err.message;
          errEl.style.display = "inline";
          btn.disabled = false; btn.textContent = "🎉 Criar sorteio";
        }
      });

      window.endGiveawayNow = async (id) => {
        if (!confirm("Encerrar este sorteio e anunciar vencedores no Discord?")) return;
        try {
          await endGiveaway(guildId, id);
          load();
        } catch (err) { alert("Erro: " + err.message); }
      };

    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
