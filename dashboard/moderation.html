<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderação — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>🔨 Moderação</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getModeration, deleteCase, getUserInfractionsApi, getStoredGuild, logout, getChannels, setSlowmode, lockChannel } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";
  import { formatDate, actionBadge } from "./js/layout.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "moderation") a.classList.add("active"); });

  let channelData = [];

  async function load() {
    try {
      const [
        { cases, activeMutes, activeBans, totalByAction },
        { channels: channelList },
      ] = await Promise.all([
        getModeration(guildId, 50),
        getChannels(guildId),
      ]);
      channelData = channelList;

      const byAction = {};
      totalByAction.forEach((r) => byAction[r.action] = r.cnt);

      document.getElementById("content").innerHTML = `
        <div class="grid grid-4" style="margin-bottom:24px">
          <div class="stat-card">
            <div class="stat-icon">⚠️</div>
            <div class="stat-value">${byAction.warn ?? 0}</div>
            <div class="stat-label">Avisos totais</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🔇</div>
            <div class="stat-value">${activeMutes.length}</div>
            <div class="stat-label">Mutes ativos</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⛔</div>
            <div class="stat-value">${activeBans.length}</div>
            <div class="stat-label">Tempbans ativos</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📋</div>
            <div class="stat-value">${(byAction.warn ?? 0) + (byAction.mute ?? 0) + (byAction.kick ?? 0) + (byAction.ban ?? 0) + (byAction.tempban ?? 0)}</div>
            <div class="stat-label">Total de casos</div>
          </div>
        </div>

        <!-- Gerenciamento de canais -->
        <div class="card" style="margin-bottom:20px">
          <h3 style="margin:0 0 16px;font-size:15px">🔧 Gerenciamento de canais</h3>
          <div style="margin-bottom:14px">
            <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Selecione um canal de texto</label>
            <select class="form-control" id="channelSelect" style="max-width:280px">
              <option value="">Escolha um canal...</option>
              ${channelList.map(c => `<option value="${c.id}" data-slowmode="${c.slowmode}" data-locked="${c.locked ? '1' : '0'}">#${c.name}</option>`).join("")}
            </select>
          </div>
          <div id="channelControls" style="display:none">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div style="background:var(--bg-secondary);padding:14px;border-radius:8px">
                <div style="font-size:13px;font-weight:600;margin-bottom:12px">⏱️ Modo lento</div>
                <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
                  ${[["Off","0"],["5s","5"],["10s","10"],["30s","30"],["1min","60"],["5min","300"],["1h","3600"]].map(([l,v]) => `<button class="btn btn-ghost btn-sm slowmode-preset" data-sec="${v}">${l}</button>`).join("")}
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="number" class="form-control" id="slowmodeInput" placeholder="0–21600 seg" min="0" max="21600" style="max-width:140px" />
                  <button class="btn btn-primary btn-sm" id="applySlowmode">Aplicar</button>
                </div>
                <p id="slowmodeStatus" style="font-size:12px;margin-top:8px;color:var(--text-muted)"></p>
              </div>
              <div style="background:var(--bg-secondary);padding:14px;border-radius:8px">
                <div style="font-size:13px;font-weight:600;margin-bottom:10px">🔒 Travar canal</div>
                <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Impede que membros comuns enviem mensagens neste canal.</p>
                <p id="lockStatus" style="font-size:13px;font-weight:500;margin-bottom:12px"></p>
                <button class="btn btn-sm" id="lockBtn"></button>
              </div>
            </div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
          <!-- Busca por usuário -->
          <div class="card">
            <h3 style="margin:0 0 12px;font-size:15px">🔍 Buscar por usuário</h3>
            <div style="display:flex;gap:8px">
              <input class="form-control" id="searchUserId" placeholder="ID do usuário" />
              <button class="btn btn-primary" id="searchBtn">Buscar</button>
            </div>
            <div id="userResult" style="margin-top:12px"></div>
          </div>

          <!-- Mutes ativos -->
          <div class="card">
            <h3 style="margin:0 0 12px;font-size:15px">🔇 Mutes ativos</h3>
            ${activeMutes.length === 0
              ? '<p style="color:var(--text-muted);font-size:14px">Nenhum mute ativo.</p>'
              : `<div style="display:flex;flex-direction:column;gap:6px">
                  ${activeMutes.slice(0, 5).map(m => `
                    <div style="display:flex;justify-content:space-between;padding:7px 12px;background:var(--bg-secondary);border-radius:6px">
                      <code style="font-size:12px">${m.user_id}</code>
                      <span style="font-size:12px;color:var(--yellow)">Expira: ${formatDate(m.expires_at)}</span>
                    </div>`).join("")}
                </div>`}
          </div>
        </div>

        <!-- Histórico de casos -->
        <div class="card">
          <div class="section-header">
            <h3>📋 Histórico de casos (últimos 50)</h3>
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm filter-btn active" data-filter="all">Todos</button>
              <button class="btn btn-ghost btn-sm filter-btn" data-filter="warn">⚠️ Warns</button>
              <button class="btn btn-ghost btn-sm filter-btn" data-filter="mute">🔇 Mutes</button>
              <button class="btn btn-ghost btn-sm filter-btn" data-filter="ban">⛔ Bans</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>Ação</th><th>Usuário</th><th>Moderador</th><th>Motivo</th><th>Data</th><th></th></tr></thead>
              <tbody id="casesTable">
                ${renderCases(cases)}
              </tbody>
            </table>
          </div>
        </div>

        ${activeBans.length > 0 ? `
        <div class="card" style="margin-top:20px">
          <h3 style="margin:0 0 12px;font-size:15px">⛔ Tempbans ativos</h3>
          <div class="table-wrap"><table>
            <thead><tr><th>Usuário</th><th>Motivo</th><th>Expira em</th></tr></thead>
            <tbody>
              ${activeBans.map(b => `
                <tr>
                  <td><code style="font-size:12px">${b.user_id}</code></td>
                  <td style="font-size:13px">${b.reason ?? '—'}</td>
                  <td style="font-size:13px;color:var(--yellow)">${formatDate(b.expires_at)}</td>
                </tr>`).join("")}
            </tbody>
          </table></div>
        </div>` : ""}`;

      // Filtros de casos
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const filter = btn.dataset.filter;
          document.querySelectorAll("#casesTable tr").forEach(row => {
            row.style.display = (filter === "all" || row.dataset.action === filter) ? "" : "none";
          });
        });
      });

      // Busca por usuário
      document.getElementById("searchBtn").addEventListener("click", async () => {
        const userId = document.getElementById("searchUserId").value.trim();
        if (!userId) return;
        const result = document.getElementById("userResult");
        result.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div>';
        try {
          const data = await getUserInfractionsApi(guildId, userId);
          const infractions = data.cases ?? data;
          if (!infractions.length) {
            result.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Nenhuma infração encontrada.</p>';
          } else {
            result.innerHTML = `<div style="font-size:13px;margin-bottom:8px;color:var(--text-muted)">${infractions.length} infração(ões) encontrada(s)</div>
              ${infractions.map(c => `
                <div style="padding:6px 10px;background:var(--bg-secondary);border-radius:6px;margin-bottom:4px;font-size:13px;display:flex;justify-content:space-between">
                  <span>#${c.case_number} ${actionBadge(c.action)} ${c.reason ? `— ${c.reason}` : ""}</span>
                  <span style="color:var(--text-muted)">${formatDate(c.created_at)}</span>
                </div>`).join("")}`;
          }
        } catch (err) { result.innerHTML = `<p style="color:var(--danger);font-size:13px">Erro: ${err.message}</p>`; }
      });

      // Gerenciamento de canais
      const channelSelect = document.getElementById("channelSelect");
      const channelControls = document.getElementById("channelControls");

      channelSelect.addEventListener("change", () => {
        const ch = channelData.find(c => c.id === channelSelect.value);
        if (!ch) { channelControls.style.display = "none"; return; }
        channelControls.style.display = "block";
        document.getElementById("slowmodeInput").value = ch.slowmode;
        updateSlowmodeStatus(ch.slowmode);
        updateLockBtn(ch.locked);
      });

      document.querySelectorAll(".slowmode-preset").forEach(btn => {
        btn.addEventListener("click", () => {
          document.getElementById("slowmodeInput").value = btn.dataset.sec;
        });
      });

      document.getElementById("applySlowmode").addEventListener("click", async () => {
        const channelId = channelSelect.value;
        if (!channelId) return;
        const seconds = Number(document.getElementById("slowmodeInput").value) || 0;
        const applyBtn = document.getElementById("applySlowmode");
        applyBtn.disabled = true;
        applyBtn.textContent = "...";
        try {
          await setSlowmode(guildId, channelId, seconds);
          const ch = channelData.find(c => c.id === channelId);
          if (ch) ch.slowmode = seconds;
          updateSlowmodeStatus(seconds);
          applyBtn.textContent = "✓ Salvo";
          setTimeout(() => { applyBtn.textContent = "Aplicar"; applyBtn.disabled = false; }, 1500);
        } catch (err) {
          alert("Erro: " + err.message);
          applyBtn.textContent = "Aplicar";
          applyBtn.disabled = false;
        }
      });

      document.getElementById("lockBtn").addEventListener("click", async () => {
        const channelId = channelSelect.value;
        if (!channelId) return;
        const ch = channelData.find(c => c.id === channelId);
        const newLocked = !ch.locked;
        const btn = document.getElementById("lockBtn");
        btn.disabled = true;
        try {
          await lockChannel(guildId, channelId, newLocked);
          ch.locked = newLocked;
          updateLockBtn(newLocked);
        } catch (err) {
          alert("Erro: " + err.message);
        } finally {
          btn.disabled = false;
        }
      });

    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }

  function updateSlowmodeStatus(seconds) {
    const el = document.getElementById("slowmodeStatus");
    if (!el) return;
    if (seconds === 0) {
      el.textContent = "Desativado";
      el.style.color = "var(--text-muted)";
    } else {
      el.textContent = `Ativo: ${formatSeconds(seconds)}`;
      el.style.color = "var(--yellow)";
    }
  }

  function updateLockBtn(locked) {
    const btn = document.getElementById("lockBtn");
    const status = document.getElementById("lockStatus");
    if (!btn || !status) return;
    if (locked) {
      btn.className = "btn btn-sm btn-primary";
      btn.textContent = "🔓 Destravar canal";
      status.innerHTML = '<span style="color:var(--danger)">🔒 Canal travado — membros não podem enviar mensagens</span>';
    } else {
      btn.className = "btn btn-sm btn-danger";
      btn.textContent = "🔒 Travar canal";
      status.innerHTML = '<span style="color:var(--green,#57f287)">🔓 Canal aberto</span>';
    }
  }

  function formatSeconds(s) {
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}min`;
    return `${Math.floor(s / 3600)}h`;
  }

  function renderCases(cases) {
    return cases.map(c => `
      <tr id="case-${c.case_number}" data-action="${c.action}">
        <td style="color:var(--text-muted);font-weight:600">#${c.case_number}</td>
        <td>${actionBadge(c.action)}</td>
        <td><code style="font-size:11px">${c.user_id}</code></td>
        <td style="font-size:11px;color:var(--text-muted)">${c.mod_id}</td>
        <td style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.reason ?? ''}">${c.reason ?? '—'}</td>
        <td style="font-size:11px;color:var(--text-muted)">${formatDate(c.created_at)}</td>
        <td>${c.active ? `<button class="btn btn-ghost btn-sm" onclick="removeCase('${guildId}',${c.case_number})">Remover</button>` : '<span style="color:var(--text-muted);font-size:11px">Inativo</span>'}</td>
      </tr>`).join("");
  }

  window.removeCase = async (guildId, caseNumber) => {
    if (!confirm(`Remover caso #${caseNumber}?`)) return;
    try { await deleteCase(guildId, caseNumber); document.getElementById(`case-${caseNumber}`)?.remove(); }
    catch (err) { alert("Erro: " + err.message); }
  };

  load();
</script>
</body>
</html>
