<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starboard — Bot Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="topbar">
      <h2>⭐ Starboard</h2>
      <div class="user-info"><img class="avatar" id="userAvatar" src="" alt="" /><span id="username"></span></div>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>
<script type="module">
  import { isLoggedIn, getModules, patchModule, getStoredGuild, logout } from "./js/api.js";
  import { sidebarHTML } from "./js/sidebar.js";

  if (!isLoggedIn()) { window.location.href = "/index.html"; }
  const guildId = getStoredGuild();
  if (!guildId) { window.location.href = "/guilds.html"; }
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
  document.getElementById("changeGuildBtn")?.addEventListener("click", () => window.location.href = "/guilds.html");
  document.querySelectorAll("nav.sidebar a[data-page]").forEach((a) => { if (a.dataset.page === "starboard") a.classList.add("active"); });

  async function load() {
    try {
      const data = await getModules(guildId);
      const s = data.starboard ?? {};
      const enabled = s.enabled ?? false;

      document.getElementById("content").innerHTML = `
        <div class="card" style="max-width:600px">
          <div class="alert alert-info">
            O Starboard copia mensagens populares para um canal de destaque quando atingem o mínimo de reações configurado.
          </div>

          <div class="form-group">
            <label>Status</label>
            <div style="display:flex;align-items:center;gap:12px">
              <label class="toggle">
                <input type="checkbox" id="sbEnabled" ${enabled ? "checked" : ""} />
                <span class="slider"></span>
              </label>
              <span id="statusLabel" style="font-size:14px">${enabled ? "✅ Ativo" : "⏸ Inativo"}</span>
            </div>
          </div>

          <div class="form-group">
            <label>Canal do Starboard (ID)</label>
            <input class="form-control" id="sbChannel" value="${s.channel_id ?? ''}" placeholder="ID do canal de destaque" />
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="form-group">
              <label>Emoji</label>
              <input class="form-control" id="sbEmoji" value="${s.emoji ?? '⭐'}" placeholder="⭐" style="font-size:20px" />
            </div>
            <div class="form-group">
              <label>Mínimo de reações</label>
              <input class="form-control" type="number" id="sbMin" value="${s.min_reactions ?? 3}" min="1" max="100" />
            </div>
          </div>

          <button class="btn btn-primary" id="saveBtn">Salvar alterações</button>
          <span id="saveMsg" style="font-size:13px;color:var(--green);margin-left:10px;display:none">✅ Salvo!</span>
        </div>`;

      document.getElementById("sbEnabled").addEventListener("change", (e) => {
        document.getElementById("statusLabel").textContent = e.target.checked ? "✅ Ativo" : "⏸ Inativo";
      });

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true; btn.textContent = "Salvando…";
        try {
          const enabled = document.getElementById("sbEnabled").checked;
          if (!enabled) {
            await patchModule(guildId, "starboard", { enabled: false });
          } else {
            await patchModule(guildId, "starboard", {
              channelId: document.getElementById("sbChannel").value,
              emoji: document.getElementById("sbEmoji").value || "⭐",
              minReactions: Number(document.getElementById("sbMin").value) || 3,
            });
          }
          const msg = document.getElementById("saveMsg");
          msg.style.display = "inline"; setTimeout(() => msg.style.display = "none", 3000);
        } catch (err) { alert("Erro: " + err.message); }
        finally { btn.disabled = false; btn.textContent = "Salvar alterações"; }
      });
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="alert alert-danger">Erro: ${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
